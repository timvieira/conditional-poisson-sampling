[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conditional-poisson-sampling"
version = "0.1.0"
description = "Conditional Poisson distribution over fixed-size subsets"
requires-python = ">=3.8"
license = "MIT"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
torch = ["torch"]
dev = ["pytest", "pytest-cov", "pytest-timeout", "coverage", "ruff", "scipy", "torch", "plotly", "cvxpy"]

[tool.setuptools.packages.find]
include = ["conditional_poisson*"]

[tool.pytest.ini_options]
timeout = 20

[tool.blog]
static = ["figures"]
preprocess = ["python extract_snippets.py"]

[tool.ruff.lint]
ignore = ["E741", "E402", "E701", "E702", "E731"]
